name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --editable ".[dev]"

      - name: Compile Python modules
        run: python -m compileall -q scripts benchmarks tests quick_validate.py

      - name: Run deterministic tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate skill contract
        run: python quick_validate.py --skill .

      - name: Lint active runtime and benchmark harness
        run: >-
          ruff check
          scripts/astra_ultra.py
          scripts/astra_ast.py
          scripts/astra_repomap.py
          scripts/astra_governor.py
          scripts/astra_mcp_server.py
          scripts/astra_prefix_lock.py
          scripts/astra_sanitizer.py
          scripts/astra_contracts.py
          scripts/astra_runtime.py
          scripts/astra_context.py
          scripts/astra_index.py
          scripts/astra_patch.py
          scripts/astra_worker.py
          benchmarks/benchmark_astra.py
          benchmarks/benchmark_codex.py
          benchmarks/benchmark_evaluation.py
          benchmarks/benchmark_lattice.py
          benchmarks/benchmark_oracle.py
          benchmarks/benchmark_support.py
          benchmarks/process_support.py
          benchmarks/real_task_catalog.py
          benchmarks/real_task_evidence.py
          benchmarks/run_real_task_benchmark.py
          --select E4,E7,E9,F
          --ignore E402

      - name: Check whitespace errors
        run: git diff --check
